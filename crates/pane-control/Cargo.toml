[package]
name = "pane-control"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Local control endpoint — lets an external process drive a running Pane instance"

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
time.workspace = true
tokio.workspace = true
tracing.workspace = true
uuid.workspace = true

pane-core.workspace = true
pane-ipc.workspace = true

[target.'cfg(unix)'.dependencies]
# Only for getuid(), which keys the fallback socket path per user.
libc = "0.2"

[dev-dependencies]
tempfile.workspace = true
# Seeding capture rows for the subscription tests. There is no public insert
# API — the proxy loop and the replay path both write that table directly — so
# the tests do the same.
rusqlite.workspace = true
