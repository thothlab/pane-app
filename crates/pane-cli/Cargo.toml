[package]
name = "pane-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Command-line interface for Pane"

# Named `pane-cli`, not `pane`: src-tauri's package is already `pane`, so its
# implicit bin target owns that filename in target/ and a second one collides.
# The name users type is handled at install time — the binary is symlinked to
# `pane` on PATH, the same split VS Code uses for its `code` command.
[[bin]]
name = "pane-cli"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
base64.workspace = true
clap = { version = "4.5", features = ["derive", "env"] }
serde.workspace = true
serde_json.workspace = true
time.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true

pane-control.workspace = true
pane-core.workspace = true
pane-ipc.workspace = true
pane-storage.workspace = true

[dev-dependencies]
tempfile.workspace = true
